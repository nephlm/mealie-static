<!DOCTYPE html>
<html lang="en">
<head>
    <title>My ShoppingList</title>
</head>
<body>
    <ul id="navigation">
    
    <h3>Dairy Products</h3>
        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="8 slices cheese">
                8 slices cheese
            </li>
            
        </ul>
    
    <h3>Frozen Foods</h3>
        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="1 onion">
                1 onion
            </li>
            
        </ul>

        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="8 Hamburger Buns">
                8 Hamburger Buns
            </li>
            
            <li>
                <input type="checkbox" id="8 Hot Dog buns">

            </li>
            
        </ul>

        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="1 tomato">
                1 tomato
            </li>
            
        </ul>

        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="3 lbs ground beef">
                3 lbs ground beef
            </li>
            
            <li>
                <input type="checkbox" id="8 Hot Dogs">
                8 Hot Dogs
            </li>
            
        </ul>
    
    <h3>Produce</h3>
        <ul style="list-style-type:none;">
            
            <li>
                <input type="checkbox" id="1 lettuce">
                1 lettuce
            </li>
            
        </ul>
    
    </ul>

</body>
</html>
